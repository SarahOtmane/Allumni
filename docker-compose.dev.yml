version: '3.8'

services:
  client:
    build:
      context: .
      dockerfile: client/Dockerfile
      target: builder
    # Launch from root using workspace
    command: npm run start -w client -- --host 0.0.0.0 --poll 5000 --disable-host-check
    volumes:
      - .:/app
      - /app/client/node_modules # Protect container modules
      - /app/node_modules        # Protect root modules
    ports:
      - "4200:4200"

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
      target: builder
    # Launch from root using workspace
    command: npm run start:dev -w server
    volumes:
      - .:/app
      - /app/server/node_modules # Protect container modules
      - /app/node_modules        # Protect root modules
    ports:
      - "3000:3000"
    env_file:
      - server/.env
